[package]
name = "httpxer"
version = "0.4.6"
edition = "2021"
description = "Native httpx-replacement: enrichment + path-fuzz with browser-grade TLS impersonation, wildcard auto-suppress, Wappalyzer tech-detect. One static binary."
license = "MIT"
authors = ["assassin-marcos"]
rust-version = "1.75"

[[bin]]
name = "httpxer"
path = "src/main.rs"

[dependencies]
# wreq = reqwest fork built on BoringSSL with preconfigured browser
# JA3/JA4/HTTP-2-SETTINGS profiles. Why we switched off reqwest+native-tls:
# Cloudflare/Akamai/Imperva/Datadome rule-block known scanner TLS fingerprints
# regardless of User-Agent. BoringSSL is the same TLS stack Chrome uses, so
# the ClientHello bytes are byte-identical to a real browser of the chosen
# version. Required for any kind of usable bug-bounty recon in 2026.
# Compression features (gzip/brotli/deflate/zstd) are mandatory: real-browser
# Emulation profiles advertise `Accept-Encoding: gzip, deflate, br, zstd` in
# the request headers. Without the matching client-side decoders, the server
# responds with a compressed body and we hand back raw bytes — which look like
# binary garbage to downstream parsers and trip pattern-loose validators by
# accident (the JU3= / H$2= byte sequences inside gzip output match e.g. the
# `.env`-file regex `^[A-Za-z_][A-Za-z0-9_]*=`). v0.3.4 fix.
wreq      = { version = "5.3", features = ["json", "cookies", "socks",
                                             "gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "2"  }    # the 100+ browser emulation profiles

# Async runtime — wreq is async-only (no blocking module), so the
# orchestration drops tokio::spawn_blocking and uses tokio::spawn directly.
tokio   = { version = "1", features = ["full"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

# Pure-Rust DNS so we don't depend on the system resolver. Cloudflare upstream,
# no /etc/hosts interference.
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }

# CLI.
clap = { version = "4.4", features = ["derive"] }

# JSON output + Wappalyzer fingerprint parse.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Regex for tech-detect.
regex = "1"

# Once-init for shared client pool + compiled fingerprints.
once_cell = "1"

# Fast non-cryptographic RNG for per-probe profile rotation (no thread_rng setup cost).
fastrand = "2"

# CIDR matching for CDN tagging.
ipnetwork = "0.20"

anyhow = "1"
url    = "2"

# ── Fuzz-mode deps (v0.3.0+) ────────────────────────────────────────────────
# md-5: per-(host,path) snippet_md5 used by the wildcard detector to flag
#       identical-body responses (CDN / SaaS catch-all 404 pages, etc.).
# hex:  lowercase hex encoding for snippet_md5 (matches retroh4ck-prober v0.1.0
#       output format so downstream parsers don't have to switch case).
# governor: token-bucket rate limiter for the per-host `--rate-limit` knob.
# chrono:   ISO-8601 timestamp on every fuzz record (UTC).
md-5     = "0.10"
hex      = "0.4"
governor = "0.6"
chrono   = { version = "0.4", features = ["serde"] }

# Self-update: pulls prebuilt release binaries from GitHub on `httpxer -u`.
# Uses rustls so it doesn't drag in another OpenSSL dep (we already have
# BoringSSL via wreq — keeping the update path on a separate TLS stack
# means an outage in one doesn't take out the other).
self_update = { version = "0.41", default-features = false, features = ["rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }

# Tiny blocking HTTP client for the GitHub tags API peek — used by
# --check-update to spot the "tag pushed, release CI still building"
# window where the Releases API doesn't show the new version yet.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
